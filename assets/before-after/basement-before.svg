<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Basement before renovation: bare concrete block walls, exposed ductwork, single bulb, water heater and furnace">
  <defs>
    <linearGradient id="sideL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7F7B72"/><stop offset="1" stop-color="#928E84"/></linearGradient>
    <linearGradient id="sideR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#7A766D"/><stop offset="1" stop-color="#8E8A80"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9E9990"/><stop offset="1" stop-color="#86817A"/></linearGradient>
    <linearGradient id="duct" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D2D5D6"/><stop offset=".5" stop-color="#B4B8BA"/><stop offset="1" stop-color="#8E9294"/></linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8F9A86"/><stop offset=".4" stop-color="#B4BEA9"/><stop offset="1" stop-color="#7C8673"/></linearGradient>
    <linearGradient id="furnace" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A8A79E"/><stop offset="1" stop-color="#8C8B83"/></linearGradient>
    <radialGradient id="bulb"><stop offset="0" stop-color="#FFE9B0" stop-opacity=".55"/><stop offset=".4" stop-color="#FFE9B0" stop-opacity=".18"/><stop offset="1" stop-color="#FFE9B0" stop-opacity="0"/></radialGradient>
    <pattern id="block" width="96" height="48" patternUnits="userSpaceOnUse"><rect width="96" height="48" fill="#86827A"/><rect x="1.5" y="1.5" width="93" height="21" fill="#A6A298"/><rect x="-46.5" y="25.5" width="93" height="21" fill="#A29E94"/><rect x="49.5" y="25.5" width="93" height="21" fill="#A29E94"/></pattern>
  </defs>

  <polygon points="0,0 1200,0 1090,50 110,50" fill="#6A5A46"/>
  <g stroke="#4F4232" stroke-width="10"><line x1="80" y1="0" x2="190" y2="50"/><line x1="300" y1="0" x2="360" y2="50"/><line x1="520" y1="0" x2="545" y2="50"/><line x1="680" y1="0" x2="655" y2="50"/><line x1="900" y1="0" x2="840" y2="50"/><line x1="1120" y1="0" x2="1010" y2="50"/></g>
  <polygon points="0,0 110,50 110,650 0,800" fill="url(#sideL)"/>
  <polygon points="1200,0 1090,50 1090,650 1200,800" fill="url(#sideR)"/>
  <rect x="110" y="50" width="980" height="600" fill="url(#block)"/>
  <!-- sill plate / rim joist -->
  <rect x="110" y="50" width="980" height="28" fill="#8A6E4E"/><rect x="110" y="78" width="980" height="6" fill="#6E563B"/>
  <!-- damp + efflorescence -->
  <path d="M110 560 C220 540 300 580 420 556 C520 536 620 572 760 552 C880 536 980 566 1090 548 L1090 650 L110 650Z" fill="#6E6A60" opacity=".45"/>
  <path d="M140 600 C180 590 230 604 280 596 M560 590 C620 580 680 598 720 588 M880 600 C930 590 990 606 1040 596" stroke="#E6E2D8" stroke-width="4" opacity=".55" fill="none"/>
  <path d="M640 84 C636 160 650 230 640 330" stroke="#5E5A52" stroke-width="2" fill="none"/>

  <!-- floor: stained concrete -->
  <polygon points="110,650 1090,650 1200,800 0,800" fill="url(#floor)"/>
  <path d="M300 700 L360 730 L350 770 L400 800" stroke="#6E6A62" stroke-width="2" fill="none"/><path d="M780 664 L820 700 L900 712" stroke="#6E6A62" stroke-width="2" fill="none"/>
  <ellipse cx="600" cy="730" rx="26" ry="8" fill="#5A564F"/><ellipse cx="600" cy="730" rx="140" ry="30" fill="#6E6A62" opacity=".25"/>

  <!-- dirty hopper window -->
  <rect x="134" y="96" width="132" height="94" fill="#8C8676"/><rect x="142" y="104" width="116" height="78" fill="#A7A89A"/>
  <rect x="142" y="140" width="116" height="42" fill="#7B7666"/><rect x="142" y="104" width="116" height="78" fill="#6E6A58" opacity=".3"/>
  <path d="M142 104 L180 104 M142 104 L142 140 M142 104 L176 136 M142 118 C152 116 158 110 160 104 M142 130 C162 126 170 116 172 104" stroke="#E2E0D8" stroke-width="1" opacity=".7" fill="none"/>

  <!-- ductwork + pipes -->
  <rect x="110" y="92" width="980" height="44" fill="url(#duct)"/>
  <g stroke="#7E8284" stroke-width="2"><line x1="290" y1="92" x2="290" y2="136"/><line x1="470" y1="92" x2="470" y2="136"/><line x1="650" y1="92" x2="650" y2="136"/><line x1="830" y1="92" x2="830" y2="136"/></g>
  <line x1="110" y1="150" x2="1090" y2="150" stroke="#B87333" stroke-width="5"/><line x1="110" y1="162" x2="900" y2="162" stroke="#3C3C3C" stroke-width="8"/>
  <rect x="960" y="136" width="70" height="200" fill="url(#duct)"/>

  <!-- bare bulb -->
  <line x1="600" y1="136" x2="600" y2="196" stroke="#2A2A2A" stroke-width="2"/><rect x="592" y="196" width="16" height="12" fill="#3A3A3A"/>
  <circle cx="600" cy="220" r="320" fill="url(#bulb)"/><circle cx="600" cy="220" r="13" fill="#FFF4CF"/>
  <line x1="606" y1="208" x2="606" y2="290" stroke="#C9B98E" stroke-width="1.5"/>

  <!-- water heater -->
  <rect x="160" y="340" width="100" height="300" rx="12" fill="url(#tank)"/><ellipse cx="210" cy="340" rx="50" ry="8" fill="#C9D1BF"/>
  <rect x="200" y="226" width="10" height="114" fill="#8E9294"/><rect x="186" y="560" width="48" height="30" fill="#4C4C44"/><ellipse cx="210" cy="648" rx="70" ry="8" fill="#000" opacity=".2"/>
  <path d="M236 340 L236 300 L300 300" stroke="#B87333" stroke-width="5" fill="none"/>
  <!-- furnace -->
  <rect x="900" y="336" width="190" height="304" fill="url(#furnace)"/><rect x="920" y="360" width="150" height="110" fill="#7E7D75"/><g stroke="#6A6962" stroke-width="3"><line x1="930" y1="380" x2="1060" y2="380"/><line x1="930" y1="396" x2="1060" y2="396"/><line x1="930" y1="412" x2="1060" y2="412"/><line x1="930" y1="428" x2="1060" y2="428"/></g>
  <rect x="920" y="500" width="150" height="110" fill="#9C9B93"/><circle cx="1050" cy="520" r="6" fill="#C04A3A"/>
  <!-- metal shelf with paint cans + boxes -->
  <g stroke="#55585A" stroke-width="4"><line x1="384" y1="380" x2="384" y2="648"/><line x1="560" y1="380" x2="560" y2="648"/><line x1="380" y1="440" x2="564" y2="440"/><line x1="380" y1="530" x2="564" y2="530"/><line x1="380" y1="620" x2="564" y2="620"/></g>
  <g><rect x="396" y="404" width="34" height="36" fill="#C9C2B0"/><rect x="434" y="410" width="30" height="30" fill="#A3B4C0"/><rect x="470" y="400" width="40" height="40" fill="#D2A75F"/><rect x="396" y="486" width="70" height="44" fill="#B48A5A"/><rect x="474" y="494" width="60" height="36" fill="#C49A68"/><rect x="398" y="580" width="44" height="40" fill="#8A8B83"/><rect x="452" y="586" width="36" height="34" fill="#C9C2B0"/></g>
  <g><rect x="640" y="560" width="120" height="88" fill="#B48A5A"/><rect x="640" y="560" width="120" height="10" fill="#9C744A"/><rect x="760" y="590" width="90" height="58" fill="#C49A68"/><rect x="664" y="500" width="84" height="60" fill="#C49A68"/><line x1="706" y1="500" x2="706" y2="560" stroke="#9C744A" stroke-width="3"/></g>

  <rect width="1200" height="800" fill="#2E2C26" opacity=".14"/>
</svg>
