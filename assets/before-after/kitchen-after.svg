  <!-- steel window -->
  <rect x="462" y="118" width="276" height="306" fill="#26241F"/>
  <rect x="470" y="126" width="260" height="290" fill="url(#sky)"/>
  <path d="M470 330 C540 300 600 318 650 300 C690 288 715 296 730 292 L730 416 L470 416Z" fill="#8EAE8A"/>
  <circle cx="510" cy="330" r="46" fill="#6F946C"/><circle cx="560" cy="350" r="38" fill="#7FA27B"/><circle cx="690" cy="320" r="54" fill="#5F855D"/><circle cx="640" cy="360" r="32" fill="#86A882"/>
  <rect x="470" y="126" width="260" height="290" fill="#fff" opacity=".08"/>
  <rect x="597" y="126" width="6" height="290" fill="#26241F"/><rect x="470" y="262" width="260" height="5" fill="#26241F"/>
