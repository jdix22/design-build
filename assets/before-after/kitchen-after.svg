    <rect x="382" y="634" width="76" height="18" rx="8" fill="#8B5A3C"/><rect x="382" y="634" width="76" height="6" rx="3" fill="#A56E4B"/>
    <g stroke="#26241F" stroke-width="5" stroke-linecap="round"><line x1="576" y1="650" x2="564" y2="792"/><line x1="624" y1="650" x2="636" y2="792"/><line x1="570" y1="728" x2="630" y2="728"/></g>
    <rect x="562" y="634" width="76" height="18" rx="8" fill="#8B5A3C"/><rect x="562" y="634" width="76" height="6" rx="3" fill="#A56E4B"/>
    <g stroke="#26241F" stroke-width="5" stroke-linecap="round"><line x1="756" y1="650" x2="744" y2="792"/><line x1="804" y1="650" x2="816" y2="792"/><line x1="750" y1="728" x2="810" y2="728"/></g>
