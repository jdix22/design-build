  <g fill="#FFF3D6"><ellipse cx="420" cy="279" rx="36" ry="5"/><ellipse cx="600" cy="279" rx="36" ry="5"/><ellipse cx="780" cy="279" rx="36" ry="5"/></g>

  <!-- island -->
  <ellipse cx="600" cy="738" rx="360" ry="16" fill="#000" opacity=".16"/>
  <rect x="284" y="574" width="632" height="158" fill="url(#flute)"/>
  <rect x="284" y="574" width="632" height="10" fill="#000" opacity=".12"/>
  <rect x="266" y="556" width="668" height="18" fill="#FBFAF7"/>
  <rect x="266" y="574" width="20" height="160" fill="#F3F0EA"/><rect x="914" y="574" width="20" height="160" fill="#ECE8E0"/>
  <path d="M276 556 C360 566 420 560 500 568" stroke="#E2DDD3" stroke-width="1.5" fill="none"/><path d="M700 562 C780 570 860 560 930 566" stroke="#E2DDD3" stroke-width="1.5" fill="none"/>
