  <rect x="700" y="526" width="12" height="30" rx="4" fill="#3E5848"/><path d="M706 526 C700 500 690 494 684 488 M706 526 C712 504 722 498 728 490" stroke="#6E9A68" stroke-width="3" fill="none" stroke-linecap="round"/>

