    <rect x="770" y="298" width="282" height="11" fill="url(#oak)"/><rect x="770" y="309" width="282" height="4" fill="#000" opacity=".08"/>
    <path d="M790 208 L794 172 Q806 162 818 172 L822 208Z" fill="#C8784E"/>
