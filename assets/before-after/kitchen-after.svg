  <rect x="812" y="469" width="136" height="30" fill="#C5C9CB"/>
  <g fill="#3A3D3F"><circle cx="836" cy="484" r="6"/><circle cx="862" cy="484" r="6"/><circle cx="898" cy="484" r="6"/><circle cx="924" cy="484" r="6"/></g>
  <rect x="826" y="516" width="108" height="76" rx="4" fill="#2B2D2F"/><rect x="826" y="516" width="108" height="20" rx="4" fill="#fff" opacity=".07"/>
  <rect x="834" y="504" width="92" height="5" rx="2.5" fill="#E8EAEB"/>
  <!-- faucet -->
  <path d="M600 452 L600 404 Q600 384 620 384 Q640 384 640 404 L640 410" stroke="url(#brass)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <rect x="590" y="446" width="20" height="7" rx="2" fill="url(#brass)"/>
  <rect x="110" y="631" width="980" height="19" fill="#1D2C22"/>

