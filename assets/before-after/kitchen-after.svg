    <circle cx="238" cy="270" r="27" fill="#F0ECE4" stroke="#DCD3C6" stroke-width="2"/>
    <rect x="290" y="252" width="14" height="46" fill="#9C5E3E"/><rect x="305" y="258" width="12" height="40" fill="#C9B48E"/><rect x="318" y="248" width="16" height="50" fill="#3E5848"/><rect x="335" y="262" width="11" height="36" fill="#E3D6BF"/>
