<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Kitchen after renovation: deep green cabinets, open oak shelving, steel window and fluted oak island">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6F1E9"/><stop offset="1" stop-color="#ECE4D8"/></linearGradient>
    <linearGradient id="sideL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DDD2C3"/><stop offset="1" stop-color="#E9E1D5"/></linearGradient>
    <linearGradient id="sideR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#D8CCBC"/><stop offset="1" stop-color="#E6DDD0"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C49C72"/><stop offset="1" stop-color="#A97E55"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4EEE9"/><stop offset=".6" stop-color="#C5D8C9"/><stop offset="1" stop-color="#A3BE9F"/></linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#36533F"/><stop offset="1" stop-color="#2A4232"/></linearGradient>
    <linearGradient id="oak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFA373"/><stop offset="1" stop-color="#B38558"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E2C48A"/><stop offset=".5" stop-color="#C39A55"/><stop offset="1" stop-color="#9C7638"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9DCDD"/><stop offset="1" stop-color="#AEB3B5"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#FFE6B0" stop-opacity=".75"/><stop offset="1" stop-color="#FFE6B0" stop-opacity="0"/></radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <pattern id="zellige" width="26" height="18" patternUnits="userSpaceOnUse"><rect width="26" height="18" fill="#EEE9E0"/><rect x=".5" y=".5" width="25" height="17" rx="1.5" fill="#F4F0E9" stroke="#DCD3C5" stroke-width=".8"/><rect x="3" y="3" width="9" height="5" fill="#fff" opacity=".35"/></pattern>
    <pattern id="flute" width="13" height="20" patternUnits="userSpaceOnUse"><rect width="13" height="20" fill="#C49868"/><rect x="0" width="4" height="20" fill="#E0B887" opacity=".35"/><rect x="11" width="2" height="20" fill="#8F6440" opacity=".45"/></pattern>
  </defs>

  <!-- room shell -->
  <polygon points="0,0 1200,0 1090,50 110,50" fill="#F1EBE2"/>
  <polygon points="0,0 110,50 110,650 0,800" fill="url(#sideL)"/>
  <polygon points="1200,0 1090,50 1090,650 1200,800" fill="url(#sideR)"/>
  <rect x="110" y="50" width="980" height="600" fill="url(#wall)"/>

  <!-- floor: wide oak planks -->
  <polygon points="110,650 1090,650 1200,800 0,800" fill="url(#floor)"/>
  <g stroke="#8F6845" stroke-width="1.4" opacity=".55">
    <line x1="180" y1="650" x2="86" y2="800"/><line x1="250" y1="650" x2="171" y2="800"/><line x1="320" y1="650" x2="257" y2="800"/><line x1="390" y1="650" x2="343" y2="800"/><line x1="460" y1="650" x2="429" y2="800"/><line x1="530" y1="650" x2="514" y2="800"/><line x1="600" y1="650" x2="600" y2="800"/><line x1="670" y1="650" x2="686" y2="800"/><line x1="740" y1="650" x2="771" y2="800"/><line x1="810" y1="650" x2="857" y2="800"/><line x1="880" y1="650" x2="943" y2="800"/><line x1="950" y1="650" x2="1029" y2="800"/><line x1="1020" y1="650" x2="1114" y2="800"/>
  </g>
  <g stroke="#8F6845" stroke-width="1" opacity=".35"><line x1="200" y1="690" x2="330" y2="690"/><line x1="700" y1="700" x2="860" y2="700"/><line x1="420" y1="745" x2="560" y2="745"/><line x1="900" y1="770" x2="1080" y2="770"/><line x1="60" y1="760" x2="190" y2="760"/></g>

